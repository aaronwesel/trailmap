[project]
name = "trailmap-backend"
version = "0.1.0"
description = "FastAPI SaaS scaffold (auth/RBAC/AI stubs)"
requires-python = ">=3.12"
dependencies = [
  "fastapi>=0.115.0",
  "uvicorn[standard]>=0.32.0",
  "pydantic-settings>=2.6.0",
  "sqlmodel>=0.0.22",
  "sqlalchemy>=2.0.36",
  "psycopg[binary]>=3.2.0",
  "alembic>=1.14.0",
  "python-jose[cryptography]>=3.3.0",
  "bcrypt>=4.2.0",
  "cryptography>=43.0.0",
  "pyotp>=2.9.0",
  "redis>=5.2.0",
  "httpx>=0.28.0",
  "boto3>=1.35.0",
  "google-auth>=2.36.0",
  "requests>=2.32.0",
  "python-multipart>=0.0.17",
  "email-validator>=2.2.0",
  "stripe>=16.0.0,<17",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.3.0",
  "pytest-asyncio>=0.24.0",
  "ruff>=0.8.0",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
pythonpath = ["."]

[tool.ruff]
line-length = 100
target-version = "py312"
