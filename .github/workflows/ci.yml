# CI: platform FastAPI + Crawl .NET + frontend + docker + terraform fmt/validate.
# No terraform apply. No cloud secrets required.

name: Trailmap CI

on:
  push:
    branches: [main, "prep/**", "feat/**", "cursor/**"]
  pull_request:
    branches: [main, "prep/**", "feat/**"]

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    name: lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Backend lint (stub until ruff wired)
        run: |
          if [ -f backend/pyproject.toml ] || [ -f backend/requirements.txt ]; then
            echo "Backend package files present — ruff/mypy optional follow-up."
          else
            echo "No backend package yet; lint stub OK."
          fi
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Frontend lint
        working-directory: frontend
        run: |
          npm ci
          npm run lint

  test-backend:
    name: test-backend
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements.txt
      - name: Install backend deps
        run: pip install -r requirements.txt
      - name: Pytest (auth + health + SES stubs)
        run: pytest -q
        env:
          ENVIRONMENT: test
          SECRET_KEY: ci-test-secret-not-for-production
          DATABASE_URL: sqlite:///:memory:
          SES_ENABLED: "false"
          LOGIN_ALERT_EMAIL_ENABLED: "false"

  test-dotnet:
    name: test-dotnet
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "8.0.x"
      - name: Restore
        run: dotnet restore Crawl.sln
      - name: Build
        run: dotnet build Crawl.sln -c Release --no-restore
      - name: Test
        run: dotnet test Crawl.sln -c Release --no-build --verbosity normal

  test-frontend:
    name: test-frontend
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install
        run: npm ci
      - name: Typecheck + production build
        run: npm run build
        env:
          VITE_API_BASE_URL: http://localhost:8000
          VITE_CRAWL_API_URL: http://localhost:8080

  docker:
    name: docker
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Validate Compose file
        run: docker compose -f docker-compose.yml config --quiet
      - name: Build platform API image
        run: docker compose -f docker-compose.yml build api
      - name: Build Crawl.Api image
        run: docker compose -f docker-compose.yml build crawl-api
      - name: Build Crawl.Worker image
        run: docker compose -f docker-compose.yml build crawl-worker
      - name: Build frontend image
        run: docker compose -f docker-compose.yml build frontend
      - name: Pull data-plane images
        run: |
          docker pull --quiet postgres:16-alpine
          docker pull --quiet redis:7-alpine
          docker pull --quiet rabbitmq:3.13-management-alpine

  terraform:
    name: terraform
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: infra/terraform
    steps:
      - uses: actions/checkout@v4
      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: "1.9.8"
      - name: Detect Terraform root
        id: tf
        run: |
          if ls *.tf >/dev/null 2>&1; then
            echo "present=true" >> "$GITHUB_OUTPUT"
          else
            echo "present=false" >> "$GITHUB_OUTPUT"
            echo "No .tf files yet; terraform fmt/validate stub OK (no apply)."
          fi
      - name: terraform fmt -check
        if: steps.tf.outputs.present == 'true'
        run: terraform fmt -check -recursive
      - name: terraform init -backend=false
        if: steps.tf.outputs.present == 'true'
        run: terraform init -backend=false
      - name: terraform validate
        if: steps.tf.outputs.present == 'true'
        run: terraform validate
      # Explicitly never: terraform apply / plan against real cloud from CI.
